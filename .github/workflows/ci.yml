name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Gates + build + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    # Postgres thật, vì e2e chạy trên app thật chứ không mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: competency
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d competency"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Hai vai, cố ý khác nhau — xem .env.example. App chạy bằng role không
      # superuser để RLS có tác dụng; DDL chạy bằng postgres để bảng không
      # thuộc về role app (chủ bảng đọc xuyên mọi policy).
      DATABASE_URL: postgresql://competency_app:competency_app_dev@localhost:5434/competency
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5434/competency
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile=false

      # ---- gates tĩnh -------------------------------------------------
      - name: Typecheck
        run: pnpm typecheck

      # Trước đây bước này có `|| echo "lint warnings allowed in MVP"` nên lint
      # trượt vẫn qua. Lint hiện đã 0 lỗi — giữ nó ở mức 0.
      - name: Lint
        run: pnpm lint

      - name: Guard (mock · hardcode · màu · tenant-scope)
        run: pnpm guard

      # ---- dựng DB từ chuỗi migration --------------------------------
      # Đúng đường mà môi trường mới sẽ đi (docs/dev/DB_SETUP.md). Nếu ai thêm
      # file .sql mà quên khai vào _journal.json, bước này dựng thiếu bảng và
      # e2e phía dưới đổ — chính là cái đã lọt suốt trước đợt B.
      - name: Tạo role app (không superuser, không bypass RLS)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -d competency -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'competency_app') THEN
              CREATE ROLE competency_app LOGIN PASSWORD 'competency_app_dev'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE competency TO competency_app;
          GRANT USAGE ON SCHEMA public TO competency_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO competency_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO competency_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO competency_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO competency_app;
          SQL

      - name: Migrate (chuỗi migration là nguồn sự thật)
        run: pnpm exec drizzle-kit migrate

      - name: Seed
        run: pnpm db:seed

      # Chạy SAU khi DB sẵn sàng: `tests/integration/**` chạm Postgres thật.
      # Hai lỗi P0 của cây (xoá node, đổi thứ tự) nằm ở tầng SQL — tầng test
      # chạm DB là tầng duy nhất bắt được chúng.
      - name: Unit + integration tests
        run: pnpm test

      # ---- build + e2e ------------------------------------------------
      # `pnpm build` là bước quan trọng nhất của file này: bug từng khiến app
      # KHÔNG deploy được (useSearchParams không bọc Suspense ở /sign-in) chỉ
      # lộ ra ở đây — typecheck, lint và unit test đều xanh khi đó.
      - name: Build production
        run: pnpm build

      - name: Cài trình duyệt Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Chạy cả project desktop lẫn mobile — trong đó có phép đo tràn ngang.
      - name: E2E (desktop + mobile)
        run: pnpm exec playwright test tests/e2e/smoke.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: application/test-results/
          retention-days: 7
